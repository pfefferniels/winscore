<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WinScore Web</title>
  </head>
  <body>
    <div id="app" class="app">
      <header class="toolbar">
        <span class="brand">WinScore Web</span>
        <button id="open" title="Open a .mus file (or an engine.json reference)">Open…</button>
        <input id="file" type="file" accept=".mus,.MUS,.json" hidden />
        <select id="sample" title="Bundled samples"></select>
        <button id="save" title="Save the score as .mus">Save</button>
        <span class="sep"></span>
        <button id="undo" title="Undo (⌘Z / Ctrl+Z)">Undo</button>
        <button id="redo" title="Redo (⇧⌘Z / Ctrl+Y)">Redo</button>
        <button id="input" title="Enter a line of music in SCORE's five passes (IN)">Input…</button>
        <span class="sep"></span>
        <button id="zoom-out" title="Zoom out (_)">−</button>
        <select id="zoom" title="Zoom"></select>
        <button id="zoom-in" title="Zoom in (+)">+</button>
        <button id="fit" title="Fit page width">Fit</button>
        <span class="sep"></span>
        <div class="segmented" id="mode" role="radiogroup" title="What to show">
          <button data-mode="rust" role="radio">Rust</button>
          <button data-mode="engine" role="radio">Engine</button>
          <button data-mode="overlay" role="radio">Overlay</button>
        </div>
        <span id="legend" class="legend" hidden>
          <i class="swatch engine"></i>engine only <i class="swatch rust"></i>Rust only <i class="swatch both"></i>both
        </span>
        <span class="spacer"></span>
        <span id="status" class="status"></span>
      </header>
      <nav class="palette" id="palette" aria-label="Item and edit commands"></nav>
      <main class="main">
        <div class="stage" id="stage">
          <canvas id="canvas"></canvas>
          <div class="viewport" id="viewport" tabindex="0" aria-label="Page"><div class="content" id="content"></div></div>
          <div class="drop-hint" id="drop-hint" hidden>Drop a .mus file or an engine.json</div>
          <div class="band" id="band" hidden></div>
        </div>
        <aside class="panel">
          <section class="item" id="item"></section>
          <section class="items">
            <h2>Items <span id="item-count" class="muted"></span></h2>
            <ol id="items" class="item-list"></ol>
          </section>
        </aside>
      </main>
      <dialog id="input-dialog" class="input-dialog">
        <form method="dialog" id="input-form">
          <h2>Score input</h2>
          <div class="input-range">
            <label>Staff <input id="input-staff" type="number" min="1" max="255" step="1" value="1" /></label>
            <label>Input range <input id="input-begin" type="number" min="0" max="200" step="any" value="2" /></label>
            <label>to <input id="input-end" type="number" min="0" max="200" step="any" value="200" /></label>
          </div>
          <div class="passes" id="input-passes">
            <label for="pass-1">1 Notes</label>
            <div><input id="pass-1" data-pass="1" type="text" value=";" placeholder="C4/D/E:G/R/M/BA/K2S/3 4;" spellcheck="false" autocomplete="off" /><small class="pass-error" id="pass-error-1"></small></div>
            <label for="pass-2">2 Rhythms</label>
            <div><input id="pass-2" data-pass="2" type="text" value=";" placeholder="4/8/8./12;" spellcheck="false" autocomplete="off" /><small class="pass-error" id="pass-error-2"></small></div>
            <label for="pass-3">3 Marks</label>
            <div><input id="pass-3" data-pass="3" type="text" value=";" placeholder="A 1/S 2:4;" spellcheck="false" autocomplete="off" /><small class="pass-error" id="pass-error-3"></small></div>
            <label for="pass-4">4 Beams</label>
            <div><input id="pass-4" data-pass="4" type="text" value=";" placeholder="1 2/3 6;" spellcheck="false" autocomplete="off" /><small class="pass-error" id="pass-error-4"></small></div>
            <label for="pass-5">5 Slurs</label>
            <div><input id="pass-5" data-pass="5" type="text" value=";" placeholder="1 4;" spellcheck="false" autocomplete="off" /><small class="pass-error" id="pass-error-5"></small></div>
          </div>
          <div class="dialog-actions">
            <span id="input-status" class="muted"></span>
            <span class="spacer"></span>
            <button value="cancel" formnovalidate>Cancel</button>
            <button id="input-insert" value="insert">Insert</button>
          </div>
        </form>
      </dialog>
      <dialog id="symbol-dialog" class="symbol-dialog">
        <form method="dialog">
          <h2>Symbol library</h2>
          <div class="symbol-search">
            <input id="symbol-search" type="search" placeholder="Search by number or name" autocomplete="off" spellcheck="false" />
            <span id="symbol-count" class="muted"></span>
          </div>
          <div id="symbol-grid" class="symbol-grid"></div>
          <div class="dialog-actions">
            <span class="muted">Inserted at the selection, the last click on the paper, or the top staff at P3 100.</span>
            <span class="spacer"></span>
            <button value="cancel" formnovalidate>Cancel</button>
          </div>
        </form>
      </dialog>
      <dialog id="text-dialog" class="text-dialog">
        <form method="dialog">
          <h2>Text</h2>
          <div class="text-fields">
            <label for="text-value">Text</label>
            <input id="text-value" type="text" placeholder="e.g. Allegro, or several items divided by /" autocomplete="off" spellcheck="false" />
            <label for="text-font">Font</label>
            <select id="text-font"></select>
            <label>Place</label>
            <div class="input-range">
              <label>Staff <input id="text-staff" type="number" min="1" max="255" step="1" /></label>
              <label>P3 <input id="text-p3" type="number" step="any" /></label>
              <label>P4 <input id="text-p4" type="number" step="any" /></label>
            </div>
          </div>
          <div class="dialog-actions">
            <span class="muted">0 keeps WinScore's default for P3 and P4.</span>
            <span class="spacer"></span>
            <button value="cancel" formnovalidate>Cancel</button>
            <button id="text-insert" class="primary" value="insert">Insert</button>
          </div>
        </form>
      </dialog>
      <footer class="footer">
        <span id="prompt" class="prompt" hidden></span>
        <input id="command" class="command" type="text" placeholder="Type a SCORE command, e.g. R 5, 600 5, NOTE, DE" autocomplete="off" spellcheck="false" />
        <button id="prompt-cancel" type="button" hidden title="End the group edit without a change">Cancel</button>
        <span id="message" class="message"></span>
        <span class="spacer"></span>
        <span id="cursor" class="muted cursor"></span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
