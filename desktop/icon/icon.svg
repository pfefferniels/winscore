<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The app's mark (web/index.html's brand) on a macOS icon tile: 824 px with Apple's corner radius. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.28" />
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)" />
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="10">
    <path d="M180 392h664M180 472h664M180 552h664M180 632h664M180 712h664" />
  </g>
  <g transform="translate(200 188) scale(26)" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 18V5l11-2v13" />
    <circle cx="6" cy="18" r="3" fill="#ffffff" />
    <circle cx="17" cy="16" r="3" fill="#ffffff" />
  </g>
</svg>
