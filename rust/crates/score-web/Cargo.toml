[package]
name = "score-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "WebAssembly API of the SCORE editor: open, render, hit-test, edit and save .mus files"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
score-format = { path = "../score-format" }
score-render = { path = "../score-render" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"
