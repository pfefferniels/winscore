[package]
name = "score-testkit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Reference fixtures from WinScore's engine and display-list comparison"

[dependencies]
score-format = { path = "../score-format" }
score-layout = { path = "../score-layout" }
score-render = { path = "../score-render" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "score-compare"
path = "src/bin/score-compare.rs"

[[bin]]
name = "score-triage"
path = "src/bin/score-triage.rs"
