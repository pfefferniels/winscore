# Tests the Rust crates, builds the web app (web/) and runs its smoke test on
# every push; on main the built app is published to GitHub Pages.
name: Web app

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a branch replaces its check; deploys of main run to the end.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # The CLI must match the crate's wasm-bindgen version (web/README.md).
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Rust tests
        working-directory: rust
        run: cargo test --workspace

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      - name: Smoke test
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run smoke

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
