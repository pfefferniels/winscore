# Builds the desktop app (desktop/, Tauri) for macOS as a disk image for
# Apple silicon and Intel Macs on every push, kept as the run's artifact; a
# tag v… also publishes it as a release.
name: Mac app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            desktop/src-tauri
      # The CLI must match the crate's wasm-bindgen version (web/README.md).
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Install
        run: |
          npm ci --prefix web
          npm ci --prefix desktop

      # Builds the web app first (tauri.conf.json's beforeBuildCommand), then
      # the app for both architectures, signed ad hoc, and its disk image.
      - name: Build
        working-directory: desktop
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Find the disk image
        id: dmg
        run: echo "path=$(ls desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: WinScore-macOS
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.dmg.outputs.path }}
